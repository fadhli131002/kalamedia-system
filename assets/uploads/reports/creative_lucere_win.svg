  <polygon points="292,165 315,180 292,195" fill="#FFFFFF"/>
  
  <!-- Video Title & Stats -->
  <text x="300" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Styling Tutorial Pashmina Silk Shimmer</text>
