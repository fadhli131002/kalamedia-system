      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#701A75"/>
    </linearGradient>
    <linearGradient id="badgeGradLucere" x1="0%" y1="0%" x2="100%" y2="0%">
