  <rect width="600" height="400" fill="url(#bgGradLucere)" rx="12"/>
  
  <!-- Video Mockup Frame -->
  <rect x="24" y="24" width="552" height="352" rx="10" fill="#000000" fill-opacity="0.45" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="4 4"/>
  
