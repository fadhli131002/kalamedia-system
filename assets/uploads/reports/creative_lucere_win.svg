  <text x="300" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">1.150.000 Views</text>

  <rect x="400" y="315" width="130" height="40" rx="8" fill="#27272A" stroke="#3F3F46"/>
  <text x="465" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#D4D4D8" text-anchor="middle">ORDERS (CONV)</text>
