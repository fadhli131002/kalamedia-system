  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Video Mockup Frame -->
  <rect x="24" y="24" width="552" height="352" rx="10" fill="#000000" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Winning Badge -->
  <rect x="44" y="44" width="170" height="34" rx="17" fill="url(#badgeGrad)"/>
  <text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">🏆 WINNING CREATIVE</text>
  
  <!-- Play Icon -->
  <circle cx="300" cy="180" r="42" fill="#38BDF8" fill-opacity="0.25"/>
  <circle cx="300" cy="180" r="32" fill="#0284C7"/>
  <polygon points="292,165 315,180 292,195" fill="#FFFFFF"/>
  
  <!-- Video Title & Stats -->
  <text x="300" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">Virtual Tour 360° Unit Hook 2-Lantai</text>
  <text x="300" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Grand BSD Residence &bull; Hook: "Cicilan 3 Jt-an Free Biaya KPR"</text>
  
  <!-- KPI Pills at Bottom -->
  <rect x="70" y="315" width="130" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="135" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">RETENTION</text>
  <text x="135" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">52.4% Avg</text>

  <rect x="235" y="315" width="130" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="300" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">CTR (ADS)</text>
  <text x="300" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">3.85% High</text>

  <rect x="400" y="315" width="130" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="465" y="333" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">CONVERSIONS</text>
  <text x="465" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle">60 Closing Units</text>
