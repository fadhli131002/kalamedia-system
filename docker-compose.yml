version: '3.8'

services:
  kalamedia-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalamedia-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Persistent SQLite database storage
      - ./database:/var/www/html/database
      # Persistent upload files (bukti transfer / receipts)
      - ./assets/uploads:/var/www/html/assets/uploads
    environment:
      - TZ=Asia/Jakarta
